<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b62c4">
<title>Météo — Greg</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --c1:#0b62c4; --c2:#2f8fe0; --c3:#7cc4f0;
  --card:rgba(255,255,255,.13);
  --card-b:rgba(255,255,255,.22);
  --dim:rgba(255,255,255,.72);
  --txt:#fff;
}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--txt);background:#0b62c4;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding:18px 14px 48px;overflow-x:hidden;
}
#bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(165deg,var(--c1),var(--c2) 52%,var(--c3));transition:background .9s ease}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 0%,rgba(255,255,255,.20),transparent 48%)}
.wrap{max-width:820px;margin:0 auto;position:relative;transition:opacity .25s}
body.loading .wrap{opacity:.55;pointer-events:none}

.card{background:var(--card);border:1px solid var(--card-b);border-radius:24px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 32px rgba(0,0,0,.17);padding:22px;margin-bottom:16px;
  animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim);
  font-weight:700;margin-bottom:14px}

.cur-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.city{font-size:23px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.sub{font-size:12.5px;color:var(--dim);margin-top:4px}
.units{display:flex;background:rgba(0,0,0,.2);border-radius:12px;padding:3px;gap:2px;flex:none}
.units button{border:0;background:none;color:var(--dim);font-family:inherit;font-size:13px;font-weight:700;
  padding:6px 12px;border-radius:9px;cursor:pointer;transition:.2s}
.units button.on{background:rgba(255,255,255,.92);color:#132a4a}

.cur-main{display:flex;align-items:center;gap:16px;margin:16px 0 4px}
.big-icon{width:104px;height:104px;flex:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.28));
  animation:float 5.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.big-icon svg{width:100%;height:100%;display:block}
.temp{font-size:66px;font-weight:200;line-height:.95;letter-spacing:-4px;display:flex;align-items:flex-start}
.temp .deg{font-size:30px;font-weight:300;letter-spacing:0;margin-top:4px}
.desc{font-size:16px;font-weight:600;margin-top:4px}
.feels{font-size:13px;color:var(--dim);margin-top:3px}

.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-top:20px}
.detail{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);
  border-radius:16px;padding:11px 13px}
.detail .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
  margin-bottom:5px;font-weight:600}
.detail .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

.hourly{display:flex;gap:4px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x proximity;
  scrollbar-width:thin}
.hourly::-webkit-scrollbar{height:5px}
.hourly::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:4px}
.h-item{flex:none;width:66px;text-align:center;padding:11px 4px;border-radius:16px;
  scroll-snap-align:start;transition:background .2s}
.h-item:hover{background:rgba(255,255,255,.1)}
.h-time{font-size:11.5px;color:var(--dim);margin-bottom:9px;font-weight:600}
.h-ic{width:27px;height:27px;margin:0 auto 9px;opacity:.95}
.h-ic svg{width:100%;height:100%;display:block}
.h-t{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.h-p{font-size:10.5px;color:#8fd8ff;margin-top:4px;height:13px;font-weight:600}

.day{display:grid;grid-template-columns:44px 26px 34px 33px 1fr 33px;align-items:center;
  gap:9px;padding:10px 2px;font-size:14px}
.day + .day{border-top:1px solid rgba(255,255,255,.09)}
.d-name{font-weight:700}
.d-ic{width:25px;height:25px;opacity:.95}
.d-ic svg{width:100%;height:100%;display:block}
.d-p{font-size:11px;color:#8fd8ff;font-weight:600}
.bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.17);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;
  background:linear-gradient(90deg,#5ec8f5,#ffd166,#ff7b54)}
.d-min{font-size:13px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.d-max{font-size:13.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

.foot{text-align:center;font-size:11.5px;color:var(--dim);margin-top:10px;opacity:.8}

@media (max-width:420px){
  .big-icon{width:84px;height:84px}
  .temp{font-size:56px;letter-spacing:-3px}
  .card{padding:18px;border-radius:20px}
  .day{grid-template-columns:40px 24px 30px 30px 1fr 30px;gap:7px}
}
</style>
</head>
<body>
<div id="bg"></div>

<div class="wrap">
  <section class="card">
    <div class="cur-head">
      <div>
        <h1 class="city" id="city">Chargement…</h1>
        <div class="sub" id="sub"></div>
      </div>
      <div class="units" id="units">
        <button data-u="c" class="on">°C</button>
        <button data-u="f">°F</button>
      </div>
    </div>

    <div class="cur-main">
      <div class="big-icon" id="bigIcon"></div>
      <div>
        <div class="temp"><span id="tNow">—</span><span class="deg">°</span></div>
        <div class="desc" id="desc">—</div>
        <div class="feels" id="feels"></div>
      </div>
    </div>

    <div class="details" id="details"></div>
  </section>

  <section class="card">
    <h2 class="card-title">Prévisions horaires</h2>
    <div class="hourly" id="hourly"></div>
  </section>

  <section class="card">
    <h2 class="card-title">Prévisions sur 7 jours</h2>
    <div id="daily"></div>
  </section>

  <p class="foot">Données : <strong>Open-Meteo</strong> · <span id="upd"></span></p>
</div>

<script>
const el = id => document.getElementById(id);

const WMO = {
  0:'Ciel dégagé', 1:'Principalement dégagé', 2:'Partiellement nuageux', 3:'Couvert',
  45:'Brouillard', 48:'Brouillard givrant',
  51:'Bruine légère', 53:'Bruine modérée', 55:'Bruine dense',
  56:'Bruine verglaçante', 57:'Bruine verglaçante dense',
  61:'Pluie légère', 63:'Pluie modérée', 65:'Pluie forte',
  66:'Pluie verglaçante', 67:'Pluie verglaçante forte',
  71:'Neige légère', 73:'Neige modérée', 75:'Neige forte', 77:'Grains de neige',
  80:'Averses légères', 81:'Averses modérées', 82:'Averses violentes',
  85:'Averses de neige', 86:'Fortes averses de neige',
  95:'Orage', 96:'Orage avec grêle', 99:'Orage avec forte grêle'
);

const STROKE = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';

const IC = {
  sun:`<circle cx="12" cy="12" r="4.3"/>
       <line x1="12" y1="2" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="22"/>
       <line x1="2" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="22" y2="12"/>
       <line x1="4.9" y1="4.9" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.1" y2="19.1"/>
       <line x1="4.9" y1="19.1" x2="6.4" y2="17.6"/><line x1="17.6" y1="6.4" x2="19.1" y2="4.9"/>`,
  moon:`<path d="M20.6 13.4A8.7 8.7 0 1 1 10.6 3.4a6.9 6.9 0 0 0 10 10z"/>`,
  cloud:`<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a4 4 0 0 0 0-8z"/>`,
  drizzle:`<line x1="8" y1="19" x2="8" y2="21"/><line x1="8" y1="13" x2="8" y2="15"/>
           <line x1="16" y1="19" x2="16" y2="21"/><line x1="16" y1="13" x2="16" y2="15"/>
           <line x1="12" y1="21" x2="12" y2="23"/><line x1="12" y1="15" x2="12" y2="17"/>
           <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>`,
  rain:`<line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/>
        <line x1="12" y1="15" x2="12" y2="23"/>
        <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>`,
  snow:`<path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/>
        <line x1="8" y1="16" x2="8.01" y2="16"/><line x1="8" y1="20" x2="8.01" y2="20"/>
        <line x1="12" y1="18" x2="12.01" y2="18"/><line x1="12" y1="22" x2="12.01" y2="22"/>
        <line x1="16" y1="16" x2="16.01" y2="16"/><line x1="16" y1="20" x2="16.01" y2="20"/>`,
  thunder:`<path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/>
           <polyline points="13 11 9 17 15 17 11 23"/>`,
  fog:`<path d="M20 15.58A5 5 0 0 0 18 6h-1.26A8 8 0 1 0 4 14.25"/>
       <line x1="5" y1="19" x2="19" y2="19"/><line x1="7" y1="22" x2="17" y2="22"/>`
};

function iconHTML(code, isDay){
  const day = isDay == null ? true : !!isDay;
  const sm = day ? IC.sun : IC.moon;
  const partly = `<g transform="translate(6,1.5) scale(0.58)">${sm}</g>
                  <g transform="translate(0.5,6) scale(0.8)">${IC.cloud}</g>`;
  let inner;
  if (code === 0) inner = sm;
  else if (code === 1 || code === 2) inner = partly;
  else if (code === 3) inner = IC.cloud;
  else if (code === 45 || code === 48) inner = IC.fog;
  else if (code >= 51 && code <= 57) inner = IC.drizzle;
  else if (code >= 61 && code <= 67) inner = IC.rain;
  else if (code >= 71 && code <= 77) inner = IC.snow;
  else if (code >= 80 && code <= 82) inner = IC.rain;
  else if (code >= 85 && code <= 86) inner = IC.snow;
  else if (code >= 95) inner = IC.thunder;
  else inner = IC.cloud;
  return `<svg viewBox="0 0 24 24" ${STROKE}>${inner}</svg>`;
}

function gradientFor(code, isDay){
  const day = !!isDay;
  if (!day){
    if (code <= 1) return ['#050b1f','#0f1c3d','#1d3566'];
    if (code >= 95) return ['#150a26','#2a1845','#0b0616'];
    if (code >= 51) return ['#08111c','#152430','#22394a'];
    return ['#0b1220','#1a2436','#2b3a50'];
  }
  if (code === 0) return ['#0b62c4','#2f8fe0','#7cc4f0'];
  if (code === 1 || code === 2) return ['#1d6ec0','#4a90cf','#8fbcdd'];
  if (code === 3) return ['#4a5c70','#6d8298','#9aacbd'];
  if (code === 45 || code === 48) return ['#556472','#7c8b99','#a6b2bd'];
  if (code >= 95) return ['#1c1730','#3a2c58','#54406f'];
  if ((code >= 71 && code <= 77) || code >= 85) return ['#5b7086','#8195a8','#b3c3d1'];
  return ['#2c3e50','#456079','#6b849b'];
}

const state = { unit:'c', data:null, place:null };

function temp(v){
  if (v == null || isNaN(v)) return '—';
  return Math.round(state.unit === 'f' ? v * 9 / 5 + 32 : v);
}

function isDayAt(iso, D){
  const date = iso.slice(0,10);
  const idx = D.daily.time.indexOf(date);
  if (idx < 0) return true;
  const hm = iso.slice(11,16);
  return hm >= D.daily.sunrise[idx].slice(11,16) && hm < D.daily.sunset[idx].slice(11,16);
}

async function fetchWeather(lat, lon){
  const p = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl',
    hourly: 'temperature_2m,weather_code,precipitation_probability',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max',
    timezone: 'auto',
    forecast_days: '7'
  });
  const r = await fetch('https://api.open-meteo.com/v1/forecast?' + p.toString());
  if (!r.ok) throw new Error('weather);
  return r.json();
}

async function load(lat, lon, label, sub){
  document.body.classList.add('loading);
  try{
    const d = await fetchWeather(lat, lon);
    state.data = d;
    state.place = { label, sub };
    render();
  }catch(e){
    console.error(e);
    alert('Impossible de récupérer la météo. Vérifiez votre connexion internet.');
  }finally{
    document.body.classList.remove('loading);
  }
}

function render(){
  const D = state.data, P = state.place;
  if (!D) return;
  const c = D.current;

  const g = gradientFor(c.weather_code, c.is_day);
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty '--c1', g[0]);
  rootStyle.setProperty '--c2', g[1]);
  rootStyle.setProperty '--c3', g[2]);

  el('city').textContent = P.label;
  el('sub').textContent = [P.sub, 'MAJ ' + c.time.slice(11,16)].filter(Boolean).join(' · ');

  el('bigIcon').innerHTML = iconHTML(c.weather_code, c.is_day);
  el('tNow').textContent = temp(c.temperature_2m);
  el('desc').textContent = WMO[c.weather_code] || 'Conditions inconnues';
  el('feels').textContent = `Ressenti ${temp(c.apparent_temperature)}°`;

  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
  const wd = dirs[Math.round(c.wind_direction_10m / 22.5) % 16];
  const rows = [
    ['Vent ' + wd, Math.round(c.wind_speed_10m) + ' km/h'],
    ['Humidité', c.relative_humidity_2m + ' %'],
    ['Pression', Math.round(c.pressure_msl) + ' hPa'],
    ['Précipitations', (c.precipitation || 0).toFixed(1) + ' mm'],
    ['Lever du soleil', D.daily.sunrise[0].slice(11,16)],
    ['Coucher du soleil', D.daily.sunset[0].slice(11,16)]
  ];
  el('details').innerHTML = rows.map(([k,v]) =>
    `<div class="detail"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  const H = D.hourly;
  const key = c.time.slice(0,13) + ':00';
  let i0 = H.time.findIndex(x => x >= key);
  if (i0 < 0) i0 = 0;

  let html = '';
  for (let i = i0; i < i0 + 24 && i < H.time.length; i++){
    const hr = H.time[i].slice(11,13);
    const label = i === i0 ? 'Maint.' : hr + 'h';
    const pp = H.precipitation_probability[i];
    html += `<div class="h-item">
        <div class="h-time">${label}</div>
        <div class="h-ic">${iconHTML(H.weather_code[i], isDayAt(H.time[i], D))}</div>
        <div class="h-t">${temp(H.temperature_2m[i])}°</div>
        <div class="h-p">${pp >= 20 ? pp + '%' : ''}</div>
      </div>`;
  }
  el('hourly').innerHTML = html;

  const dmins = D.daily.temperature_2m_min;
  const dmaxs = D.daily.temperature_2m_max;
  const gMin = Math.min(...dmins);
  const gMax = Math.max(...dmaxs);
  const span = Math.max(gMax - gMin, 1);
  const names = ['Dim.','Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.'];

  let dh = '';
  for (let i = 0; i < D.daily.time.length; i++){
    const dt = new Date(D.daily.time[i] + 'T12:00:00);
    const nm = i === 0 ? 'Auj.' : i === 1 ? 'Dem.' : names[dt.getDay());
    const left = ((dmins[i] - gMin) / span) * 100;
    const width = Math.max(((dmaxs[i] - dmins[i]) / span) * 100, 6);
    const pp = D.daily.precipitation_probability_max[i];
    dh += `<div class="day">
        <span class="d-name">${nm}</span>
        <span class="d-ic">${iconHTML(D.daily.weather_code[i], 1)}</span>
        <span class="d-p">${pp >= 20 ? pp + '%' : ''}</span>
        <span class="d-min">${temp(dmins[i])}°</span>
        <span class="bar"><i style="left:${left}%;width:${width}%"></i></span>
        <span class="d-max">${temp(dmaxs[i])}°</span>
      </div>`;
  }
  el('daily').innerHTML = dh;

  el('upd').textContent = 'actualisé à ' + c.time.slice(11,16);
}

el('units').addEventListener('click', e => {
  const b = e.target.closest('button);
  if (!b) return;
  state.unit = b.dataset.u;
  [...el('units').children].forEach(x => x.classList.toggle('on', x === b));
  if (state.data) render();
});

(function init(){
  load(50.5055, 3.7890, 'Greg', 'Hainaut, Belgique);
})();
</script>
</body>
</html>
